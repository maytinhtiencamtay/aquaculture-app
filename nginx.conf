server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Flutter entry files — never cache (change every build)
    location ~ ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Default: no aggressive cache for HTML
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (fonts, images, canvaskit, shaders)
    location ~* \.(woff|woff2|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache JS/CSS inside canvaskit & assets (fingerprinted / versioned)
    location ~* ^/(canvaskit|assets)/.+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
